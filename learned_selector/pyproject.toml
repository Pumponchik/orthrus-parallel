[project]
name = "orthrus-lab"
version = "0.1.0"
description = "Reproducible native Orthrus inference experiments on CV10"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.6.0+cu118",
  "transformers==5.12.1",
  "numpy==2.2.6",
  "nvidia-ml-py==13.610.43",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[dependency-groups]
selector = [
    "catboost==1.2.8",
]
